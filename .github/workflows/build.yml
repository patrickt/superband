name: build

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config librubberband-dev
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install cmake rubberband
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build